services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - '8081:8081'
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_SERVER_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    volumes:
    - ./front/app:/app/front
    - /front/app/node_modules
    ports:
      - '3000:3000'

  postgres:
    image: postgres:16.2
    restart: unless-stopped
    volumes:
      - ./back/app/sql/schema/create_db/create_db.sql:/docker-entrypoint-initdb.d/schema/create_db.sql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}